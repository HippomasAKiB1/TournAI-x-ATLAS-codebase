services:
  # 1. FastAPI Backend Service
  - type: web
    name: tournai-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tournai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: tournai-redis
          type: redis
          property: connectionString
      - key: USE_CELERY
        value: "true"

  # 2. Celery Background Worker
  - type: worker
    name: tournai-celery-worker
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: celery -A backend.app.tasks.celery worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tournai-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: tournai-redis
          type: redis
          property: connectionString

  # 3. Next.js Frontend Service
  - type: web
    name: tournai-frontend
    runtime: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run start
    envVars:
      # In Next.js, env variables starting with NEXT_PUBLIC_ are baked in during build.
      # You can replace this value in the Render dashboard with your actual backend service URL (e.g. https://tournai-backend.onrender.com/api)
      - key: NEXT_PUBLIC_API_URL
        value: "https://your-backend-service-url.onrender.com/api"

  # 4. Managed Redis Service
  - type: redis
    name: tournai-redis
    plan: free

databases:
  # Managed PostgreSQL DB
  - name: tournai-db
    plan: free
