services:
  # 1. FastAPI Backend Service
  - type: web
    name: tournai-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: COOKIE_SECURE
        value: "true"

  # 2. Next.js Frontend Service
  - type: web
    name: tournai-frontend
    runtime: node
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm run start
    envVars:
      # Replace this with your actual backend service URL in Render (e.g. https://tournai-backend.onrender.com/api)
      - key: NEXT_PUBLIC_API_URL
        value: "https://your-backend-service-url.onrender.com/api"
